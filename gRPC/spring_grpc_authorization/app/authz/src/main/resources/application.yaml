spring:
  application:
    name: authz
  #threads:
  #  virtual:
  #    enabled: true

  datasource:
    username: postgres
    password: primaryPassword123
    url: jdbc:postgresql://127.0.0.1:8085/postgres?targetServerType=primary&hostRecheckSeconds=10&sslmode=disable&loglevel=2
  #  driver-class-name: org.postgresql.Driver
  security:
    #user:
    #  name: spring
    #  password: "password"
    #  roles:
    #    - "ADMIN"   # Spring auto-prefixes this to become "ROLE_ADMIN"
    #    - "USER"
    #NOT USED
    oauth2:
      authorizationserver:
        client:
          spring:
            registration:
              client-id: "spring"
              client-secret: "{noop}secret"
              client-authentication-methods:
                - "client_secret_basic"
              authorization-grant-types:
                - "authorization_code"
                - "client_credentials"
                - "refresh_token"
                - "urn:ietf:params:oauth:grant-type:device_code"
              redirect-uris:
                - "http://client.local:8080/login/oauth2/code/spring"
              #post-logout-redirect-uris:
              #  - "http://localhost:8080/"
              scopes:
                - "openid"
                - "profile"
                - "user"
                - "admin"
              require-authorization-consent: true
server:
  port: 7070
  #http2:
  #  enabled: true
  servlet:
    session:
      cookie:
        name: CLIENT_SESSION
logging:
  level:
    root: info
    org.springframework.security: trace