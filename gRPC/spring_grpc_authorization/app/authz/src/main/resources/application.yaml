spring:
  application:
    name: authz
  threads:
    virtual:
      enabled: true
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true
      path: /h2-console
      generate-unique-name: false
  datasource:
    username: authzdb
    password:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      dll-auto: update
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true

  security:
    #user:
    #  name: spring
    #  password: "password"
    #  roles:
    #    - "ADMIN"   # Spring auto-prefixes this to become "ROLE_ADMIN"
    #    - "USER"
    #NOT USED
    oauth2:
      authorizationserver:
        client:
          spring:
            registration:
              client-id: "spring-grpc"
              client-secret: "{noop}grpc-secret"
              client-authentication-methods:
                - "client_secret_basic"
              authorization-grant-types:
                - "authorization_code"
                - "client_credentials"
                - "refresh_token"
                - "urn:ietf:params:oauth:grant-type:device_code"
              redirect-uris:
                - "http://client-grpc.local:8080/login/oauth2/code/spring-grpc"
              #post-logout-redirect-uris:
              #  - "http://localhost:8080/"
              scopes:
                - "openid"
                - "profile"
                - "user"
                - "admin"
              require-authorization-consent: true
          spring-http:
            registration:
              client-id: "spring-http"
              client-secret: "{noop}http-secret"
              client-authentication-methods:
                - "client_secret_basic"
              authorization-grant-types:
                - "authorization_code"
                - "client_credentials"
                - "refresh_token"
                - "urn:ietf:params:oauth:grant-type:device_code"
              redirect-uris:
                - "http://client-http.local:8083/login/oauth2/code/spring-http"
              scopes:
                - "openid"
                - "profile"
                - "admin"
              require-authorization-consent: true
server:
  port: 7070
  #http2:
  #  enabled: true
  servlet:
    session:
      cookie:
        name: CLIENT_SESSION
logging:
  level:
    root: info
    org.springframework.security: trace
    org:
      springframework:
        security:
          web:
            FilterChainProxy: debug