- name: "Install Apisix control plane chart"
  ansible.builtin.include_tasks: 
    file: "install-apisix-cp.yml"
    apply:
      tags: [apisix-cp-install, apisix-cp]
  tags:
     - apisix-cp-install
     - apisix-cp
