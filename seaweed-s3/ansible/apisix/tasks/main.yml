  ansible.builtin.include_tasks: 
    file: "install-cert.yml"
    apply:
      tags: [apisix-cert-issuer-install, apisix-cert-issuer]
  tags:
     - apisix-cert-issuer-install
     - apisix-cert-issuer
- name: "Install Apisix chart"
  ansible.builtin.include_tasks: 
    file: "install.yml"
